name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Tax-Planner
      - name: Require read access to shared packages
        env:
          MIP_READ_TOKEN: ${{ secrets.MIP_READ_TOKEN }}
        run: |
          if [ -z "$MIP_READ_TOKEN" ]; then
            echo "MIP_READ_TOKEN is required to check out Vit129/My-Investment-Port (Contents: read)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: Vit129/My-Investment-Port
          ref: main
          path: My-Investment-Port
          token: ${{ secrets.MIP_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tax-Planner/package-lock.json
      - run: npm ci
        working-directory: Tax-Planner
      - run: npm run release:check
        working-directory: Tax-Planner
