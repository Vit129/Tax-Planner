name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Tax-Planner
          persist-credentials: false
      - name: Require read access to shared packages
        env:
          MIP_CI_DEPLOY_KEY: ${{ secrets.MIP_CI_DEPLOY_KEY }}
        run: |
          if [ -z "$MIP_CI_DEPLOY_KEY" ]; then
            echo "MIP_CI_DEPLOY_KEY is required to check out Vit129/My-Investment-Port." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: Vit129/My-Investment-Port
          ref: main
          path: My-Investment-Port
          ssh-key: ${{ secrets.MIP_CI_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tax-Planner/package-lock.json
      - run: npm ci
        working-directory: Tax-Planner
      - run: npm run release:check
        working-directory: Tax-Planner
