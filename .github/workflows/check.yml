name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Tax-Planner
      - uses: actions/checkout@v4
        with:
          repository: Vit129/My-Investment-Port
          ref: main
          path: My-Investment-Port
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tax-Planner/package-lock.json
      - run: npm ci
        working-directory: Tax-Planner
      - run: npm run release:check
        working-directory: Tax-Planner
